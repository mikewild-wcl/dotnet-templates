trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - 'docs/**/*'
      - AGENTS.md
      - CLAUDE.md
      - '**/CLAUDE.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**/*'
      - '.github/chatmodes/**/*'
      - '.github/prompts/**/*'
      - '.github/skills/**/*'
      - '.agents/skills/**/*'

pr:
  branches:
    include:
      - main

pool:
  # vmImage: 'windows-latest'
  vmImage: 'ubuntu-latest'

variables:
  - name: buildConfiguration
    value: 'Release'
  - name: templateProjectPath
    value: 'src/WildConsulting.Aspire.Templates.csproj'

stages:
  - stage: Build
    displayName: 'Build and validate templates'
    jobs:
      - job: BuildAndTest
        steps:
          # GitVersion requires full history, not a shallow clone
          - checkout: self
            fetchDepth: 0

          - task: gitversion-setup@4.7.0
            displayName: 'Install GitVersion'
            inputs:
              versionSpec: '6.4.x'

          - task: gitversion-execute@4.7.0
            displayName: 'Calculate version'
            inputs:
              useConfigFile: true
              configFilePath: 'GitVersion.yml'

          # GitVersion sets Build.BuildNumber and emits variables like
          # $(GitVersion.SemVer), $(GitVersion.MajorMinorPatch)
          
          # - task: Bash@3
          #   displayName: 'Debug: List all GitVersion variables'
          #   inputs:
          #     targetType: 'inline'
          #     script: |
          #       env | grep -i gitversion | sort

          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              useGlobalJson: true

          # 1. Build each template's own solution in place
          - pwsh: |
              $failed = @()
              Get-ChildItem -Path templates -Recurse -Filter *.slnx | ForEach-Object {
                Write-Host "##[section]Building $($_.FullName)"
                dotnet build $_.FullName -c $(buildConfiguration)
                if ($LASTEXITCODE -ne 0) { $failed += $_.FullName }
              }
              if ($failed.Count -gt 0) {
                Write-Host "##vso[task.logissue type=error]Failed builds: $($failed -join ', ')"
                exit 1
              }
            displayName: 'Build template sources'

          # 2. Pack the template package with the GitVersion-calculated version
          - pwsh: |
              dotnet pack $(templateProjectPath) -c $(buildConfiguration) `
                -o $(Build.ArtifactStagingDirectory) `
                /p:PackageVersion=$env:GITVERSION_MAJORMINORPATCH
            env:
              GITVERSION_MAJORMINORPATCH: $(GitVersion.MajorMinorPatch)
            displayName: 'Pack template package ($(GitVersion.MajorMinorPatch))'

          # 3. Install the pack, instantiate each template, build the output
          - pwsh: |
              dotnet new install $(Build.ArtifactStagingDirectory)/*.nupkg

              $shortNames = Get-ChildItem -Path templates -Recurse -Filter template.json |
                Where-Object { $_.Directory.Name -eq '.template.config' } |
                ForEach-Object { (Get-Content $_.FullName -Raw | ConvertFrom-Json).shortName }

              $failed = @()
              foreach ($name in $shortNames) {
                Write-Host "##[section]Instantiating template: $name"
                $out = Join-Path $(Agent.TempDirectory) "smoke-$name"
                dotnet new $name -o $out -n SmokeTest
                if ($LASTEXITCODE -ne 0) { $failed += "$name (instantiation)"; continue }
                dotnet build $out -c $(buildConfiguration)
                if ($LASTEXITCODE -ne 0) { $failed += "$name (build)" }
              }
              if ($failed.Count -gt 0) {
                Write-Host "##vso[task.logissue type=error]Failed templates: $($failed -join ', ')"
                exit 1
              }
            displayName: 'Instantiate and build templates'

          # 4. Publish the nupkg as a pipeline artifact
          - task: PublishPipelineArtifact@1
            displayName: 'Publish template package'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'template-package'

  - stage: PublishToNuGet
    displayName: 'Publish to NuGet'
    dependsOn: Build
    # Only from main, only for CI runs (never PR validation builds)
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - deployment: PushPackage
        displayName: 'Push package to NuGet.org'
        environment: 'nuget-publish-approval'   # approval check lives on this environment
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs don't check out source by default; we need it for global.json
                - checkout: self
                  persistCredentials: true

                - task: UseDotNet@2
                  displayName: 'Install .NET SDK'
                  inputs:
                    packageType: 'sdk'
                    useGlobalJson: true

                 # Expects a pipeline variable `NuGetApiKey` with the key value, and make it secret.
                 # Add it using Pipelines > Edit pipeline > Variables. Make it secret.
                - pwsh: |
                    dotnet nuget push "$(Pipeline.Workspace)/template-package/*.nupkg" `
                      --api-key $(NuGetApiKey) `
                      --source https://api.nuget.org/v3/index.json `
                      --skip-duplicate
                  displayName: 'Push to NuGet.org'

                - pwsh: |
                    $packages = Get-ChildItem "$(Pipeline.Workspace)/template-package/*.nupkg" -File
                    if ($packages.Count -ne 1) {
                      Write-Host "##vso[task.logissue type=error]Expected exactly one .nupkg for tagging, found $($packages.Count)."
                      exit 1
                    }

                    $package = $packages[0]

                    if ($package.Name -notmatch '\.(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?)\.nupkg$') {
                      Write-Host "##vso[task.logissue type=error]Could not parse version from package name: $($package.Name)"
                      exit 1
                    }

                    $tag = "v$($Matches.version)"
                    $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
                    if ($LASTEXITCODE -ne 0) {
                      Write-Host "##vso[task.logissue type=error]Failed to check remote tags."
                      exit 1
                    }

                    if ($remoteTag) {
                      Write-Host "Tag $tag already exists on origin; skipping tag creation."
                      exit 0
                    }

                    git tag $tag
                    if ($LASTEXITCODE -ne 0) {
                      Write-Host "##vso[task.logissue type=error]Failed to create tag $tag."
                      exit 1
                    }

                    git push origin "refs/tags/$tag"
                    if ($LASTEXITCODE -ne 0) {
                      Write-Host "##vso[task.logissue type=error]Failed to push tag $tag."
                      exit 1
                    }
                  displayName: 'Tag release commit'
