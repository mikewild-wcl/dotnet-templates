trigger:
  branches:
    include: [main]
  tags:
    include: ['v*']
  paths:
    exclude:
    - README.md
    - 'docs/**/*'
    - AGENTS.md
    - CLAUDE.md
    - '**/CLAUDE.md'
    - '.github/copilot-instructions.md'
    - '.github/instructions/**/*'
    - '.github/chatmodes/**/*'
    - '.github/prompts/**/*'
    - '.github/skills/**/*'
    - '.agents/skills/**/*'
pr:
  branches:
    include: [main]

pool:
  vmImage: 'windows-latest'

variables:
  - name: buildConfiguration
    value: 'Release'

# Notes
#  - set variable https://learn.microsoft.com/en-us/azure/devops/pipelines/process/set-variables-scripts?view=azure-devops&tabs=bash#set-an-output-variable-for-use-in-future-jobs
stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, test, and validate'
        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          - task: UseDotNet@2
            displayName: 'Install .NET'
            inputs:
              version: '10.0.x'

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              dotnet tool install --tool-path "$(Agent.TempDirectory)\.tools" GitVersion.Tool --version 5.12.0
              $version = ''
              $gitVersionExe = Join-Path "$(Agent.TempDirectory)\.tools" 'dotnet-gitversion.exe'
              if (Test-Path $gitVersionExe) {
                try {
                  $version = & $gitVersionExe -output json -showvariable NuGetVersionV2 -config "$(Build.SourcesDirectory)\GitVersion.yml" 2>$null
                } catch {
                  $version = ''
                }
              }
              if ([string]::IsNullOrWhiteSpace($version)) {
                Write-Host 'GitVersion did not return a version; using a fallback version.'
                $version = "1.0.0-ci.$(Build.BuildId)"
              }
              Write-Host "Computed package version: $version"
              Write-Host "##vso[task.setvariable variable=packageVersion]$version"
              Write-Host "##vso[task.setvariable variable=packageVersion;isOutput=true]$version"
            name: setVersion
            displayName: 'Generate version with GitVersion'

          - script: dotnet restore MikeWildAspire.Templates.slnx
            displayName: 'Restore dependencies'

          - script: dotnet build MikeWildAspire.Templates.slnx --configuration $(buildConfiguration) --no-restore /p:Version="$(packageVersion)" /p:PackageVersion="$(packageVersion)"
            displayName: 'Build'

          #- script: dotnet test --configuration $(buildConfiguration) --no-build
          #  displayName: 'Run tests'

  - stage: Publish
    displayName: 'Pack & Publish'
    condition: succeeded()
    dependsOn: Build
    jobs:
      - deployment: PublishNuGet
        displayName: 'Pack and publish to NuGet.org'
        environment: 'nuget-publish-approval'
        variables:
          - name: packageVersion
            value: $[stageDependencies.Build.BuildAndTest.outputs['setVersion.packageVersion']]
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 0
                  fetchTags: true

                - task: UseDotNet@2
                  displayName: 'Install .NET'
                  inputs:
                    version: '10.0.x'

                - script: dotnet restore MikeWildAspire.Templates.slnx
                  displayName: 'Restore dependencies'

                - script: >
                    dotnet pack src/MikeWildAspire.Templates.csproj
                    --configuration $(buildConfiguration)
                    --no-restore
                    --output $(Build.ArtifactStagingDirectory)
                    /p:Version="$(packageVersion)"
                    /p:PackageVersion="$(packageVersion)"
                  displayName: 'Pack NuGet packages'

                - task: PublishBuildArtifacts@1
                  displayName: 'Publish artifacts'
                  inputs:
                    pathToPublish: '$(Build.ArtifactStagingDirectory)'
                    artifactName: 'nuget-packages'

                - pwsh: |
                    $ErrorActionPreference = 'Stop'
                    if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
                      Write-Host "NuGet API key variable 'NuGetApiKey' is not set."
                      exit 1
                    }

                    $packages = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)" -Filter *.nupkg -File
                    foreach ($package in $packages) {
                      Write-Host "Pushing $($package.FullName)"
                      dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
                    }
                  displayName: 'Push to NuGet.org'
                  env:
                    NUGET_API_KEY: $(NuGetApiKey)
